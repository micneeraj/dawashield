        <h1 style="color:#0f5e57">DawaShield · दवा कवच</h1>
        <p><b>Check your family's medicines against official CDSCO alerts.</b> DawaShield matches the batch number on a medicine strip with the Central Drugs Standard Control Organisation's monthly lists of Not of Standard Quality (NSQ) and spurious drugs.</p>
        <ul>
          <li>Speak the medicine name, type it, or take a photo of the strip</li>
          <li>Hindi and English, with spoken replies</li>
          <li>Works offline: the official list is stored on your phone</li>
          <li>Save family medicines; they are re-checked whenever CDSCO publishes a new list</li>
        </ul>
        <p>अपने परिवार की दवाएँ सरकारी CDSCO चेतावनियों से जाँचिए — बोलकर, लिखकर या फ़ोटो से। बिना इंटरनेट भी चलता है।</p>
        <p><b>Please enable JavaScript to use DawaShield.</b> Official source: <a href="https://cdscoonline.gov.in/CDSCO/viewPublicNSQDrug">CDSCO NSQ alert portal</a>.</p>
